<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rechnung</title>
<link rel="stylesheet" href="style.css">
<script src="common.js"></script>
<style>
  body{background:#e9e9f0}
  .sheet{background:#fff;color:#111;max-width:800px;margin:24px auto;padding:48px;border-radius:8px;position:relative;overflow:hidden}
  .sheet th,.sheet td{border-color:#ddd}
  .head{display:flex;justify-content:space-between;gap:24px;flex-wrap:wrap}
  pre{font:inherit;margin:0;white-space:pre-line}
  .wm{margin-top:40px;padding-top:12px;border-top:1px solid #eee;text-align:center;color:#999;font-size:.8rem}
  .sheet img{max-height:70px;max-width:220px}
  .tools{text-align:center;margin-top:16px}
  @media (max-width:600px){.sheet{padding:20px;font-size:.85rem;margin:8px}}
  @media print{body{background:#fff}.tools{display:none}.sheet{margin:0;padding:0;max-width:none}}
</style>
</head>
<body>
<div class="tools"><button class="btn" onclick="print()">Als PDF speichern / drucken</button></div>
<div class="sheet" id="sheet">Lädt…</div>
<script>
(async () => {
  const id = new URLSearchParams(location.search).get("id");
  let inv;
  try { inv = await api("/invoices/" + encodeURIComponent(id)); }
  catch (e) { $("sheet").textContent = e.status === 401 ? "Bitte einloggen." : e.message; return; }
  const c = inv.company;
  document.title = "Rechnung " + inv.number;
  $("sheet").innerHTML = `
    <div class="head">
      <div>${c.logo ? `<img src="${esc(c.logo)}" alt=""><br>` : ""}<strong>${esc(c.name || "")}</strong><pre>${esc(c.address || "")}</pre></div>
      <div><pre>${esc(inv.customer)}</pre></div>
    </div>
    <h2 style="margin-top:36px">Rechnung ${esc(inv.number)}</h2>
    <div>Datum: ${new Date(inv.date).toLocaleDateString("de-DE")}</div>
    <table style="margin:20px 0">
      <thead><tr><th>Beschreibung</th><th class="r">Menge</th><th class="r">Einzelpreis</th><th class="r">Summe</th></tr></thead>
      <tbody>${inv.items.map((i) => `<tr><td>${esc(i.description)}</td><td class="r">${i.quantity}</td><td class="r">${eur(i.price)}</td><td class="r">${eur(i.quantity * i.price)}</td></tr>`).join("")}</tbody>
      <tfoot><tr><th colspan="3" class="r">Gesamtbetrag</th><th class="r">${eur(inv.total)}</th></tr></tfoot>
    </table>
    ${c.smallBusiness ? "<p>Gemäß § 19 UStG wird keine Umsatzsteuer berechnet.</p>" : ""}
    <p>Bitte überweise den Betrag innerhalb von 14 Tagen${c.iban ? ` auf IBAN ${esc(c.iban)}` : ""}.<br>Verwendungszweck: Rechnung ${esc(inv.number)}</p>
    ${c.taxNumber ? `<p>Steuernummer: ${esc(c.taxNumber)}</p>` : ""}
    ${inv.watermark ? `<div class="wm">Erstellt mit Rechnungsblitz – gratis Rechnungen schreiben</div>` : ""}`;
})();
</script>
</body>
</html>
